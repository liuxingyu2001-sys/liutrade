# LiuTrade 商店模板
# 以 _ 开头的文件不会被加载；复制本文件、去掉下划线并改写即可新建一个商店（=一个虚拟村民）。
#
# 物品规格写法（输入 / 产出通用）：
#   1) 原版材质：        material: DIAMOND
#   2) 物品库：          library_id: "ce:命名空间:物品id"   # ce:/craftengine:/mm:/ie:/mc:
#   3) 材质 + 组件：      material: PAPER
#                        components:
#                          custom_name: "&6兑换券"
#                          lore: ["&7第一行", "&7第二行"]
#                          custom_model_data: 12345
#                          enchantment_glint_override: true
#                          unbreakable: true
#                          enchantments: { sharpness: 5 }
#                          custom_data:            # 嵌套 map 或 SNBT 字符串
#                            liutrade:coupon: true  # 直接写 PDC 键即可
#                            tier: 3
#                          # 也兼容外层包一层 PublicBukkitValues:（从 CE/其它插件抄配置时常见）
#                          # custom_data:
#                          #   PublicBukkitValues:
#                          #     liutrade:coupon: true
#   4) 全保真（任意物品）：bytes: "<Base64>"   # 主手持物品执行 /liutrade item 生成
#   5) 规则匹配（仅输入）：material: PAPER + pdc: "jiu:jiu"（+ not_pdc: soulbound）
#      —— 用 pdc/name/lore/custom_model_data + not 匹配任意物品；原生村民界面无法按
#      规则匹配这类输入（需 settings.gui-mode: custom）。
#   6) 显示覆盖（仅界面）：
#        display: { library_id: "ce:..." }   # 图标显示这个物品，匹配仍按上面规则
#        display_name: "&6神秘票券"           # 界面里显示的名字（不写则自动取中文名）
#   amount 默认 1。
#
# 每笔交易 = 1~6 个输入 → 1 个或多个产出（原生村民界面每笔最多 2 个输入）：
#   · convert: true  —— 产出由 SoulSpace 的 convert/ 转换规则决定（仅限单输入）
#   · outputs       —— 显式列出产出；条目也支持 commands:（指令产出，控制台身份执行，
#                      占位符 %player% / %uuid% / %times%）。纯指令产出仅自定义界面可用。
name: "&6铁匠"
title: "&8&l铁匠的交易"
npc: ""            # Citizens NPC 的 id（数字）或名字；留空则只能用 /liutrade open 打开
permission: ""     # 打开本商店所需权限；留空不限制
icon:              # 商店图标
  library_id: "mc:ANVIL"
trades:
  铁换金:
    name: "&f铁锭 &7→ &6金锭"          # 交易名（聊天提示 + 默认图标名）
    display_name: "&6金锭兑换"          # 仅图标显示的名字（不写则用 name）
    display:                            # 仅图标显示的物品（不写则用输入[0]）
      library_id: "mc:GOLD_INGOT"
    description:
      - "&7把铁锭换成金锭"
    inputs:
      - material: IRON_INGOT
        amount: 8
    convert: true
  钻换绿宝石:
    name: "&f钻石 &7→ &a绿宝石 x2"
    inputs:
      - material: DIAMOND
        amount: 1
    outputs:
      - material: EMERALD
        amount: 2
  自定义物品:
    name: "&f钻石 &7→ &6兑换券"
    inputs:
      - material: DIAMOND
        amount: 1
    outputs:
      - material: PAPER
        amount: 1
        components:
          custom_name: "&6兑换券"
          lore:
            - "&7用钻石换来的"
          custom_model_data: 12345
          enchantment_glint_override: true
          custom_data:
            liutrade:coupon: true
            tier: 3
  自定义数据:
    name: "&f带 SNBT custom_data 的产出"
    inputs:
      - material: GOLD_INGOT
    outputs:
      - material: NAME_TAG
        components:
          custom_name: "&b纪念品"
          custom_data: '{source:"liutrade",value:42,rare:true}'
  规则输入显示为 CE 物品:
    name: "&f神秘票券 &7→ &6金锭"
    inputs:
      # 匹配：纸 + pdc 标记；界面：显示成 CE 物品 + 自定义名（需 settings.gui-mode: custom）
      - material: PAPER
        pdc: "jiu:jiu"
        display:
          library_id: "ce:example:ticket"
        display_name: "&6神秘票券"
    outputs:
      - material: GOLD_INGOT
        amount: 2
  三材料:
    name: "&f钻石+金锭+绿宝石 &7→ &b下界合金锭"
    inputs:
      - material: DIAMOND
      - material: GOLD_INGOT
        amount: 2
      - material: EMERALD
        amount: 4
    outputs:
      - material: NETHERITE_INGOT
  指令产出:
    name: "&f钻石 &7→ &a绿宝石（指令发放）"
    inputs:
      - material: DIAMOND
        amount: 1
    outputs:
      # 以控制台身份执行；%times% 只执行一次并填入交易次数，%player% 为玩家名
      - commands:
          - "give %player% minecraft:emerald %times%"
          - "eco give %player% 100"
  物品加指令:
    name: "&f铁锭 &7→ &6金锭 &7+ 提示"
    inputs:
      - material: IRON_INGOT
    outputs:
      - material: GOLD_INGOT
        commands:
          - "say %player% 完成了一笔交易"
